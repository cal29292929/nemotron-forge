[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-forge"
version = "1.0.0"
description = "Tiered Multi-Agent Orchestrator & Physical/Code Verification Studio on Nebius Token Factory & NVIDIA Nemotron"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kazutoshi Hayashi (LUMA LAB)"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nemotron-forge = "nemotron_forge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
